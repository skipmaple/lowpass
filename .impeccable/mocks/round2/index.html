<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lowpass · 三主题整页预览 · 默认 A</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f1f3;color:#24262b;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,a{font:inherit}button{cursor:pointer}header{padding:18px 30px;background:white;border-bottom:1px solid #dddfe4;display:flex;align-items:center;gap:18px}header strong{font-size:20px;letter-spacing:-.6px}header span{color:#747983}header .decision{margin-left:auto;font-size:13px;color:#454d59}header a{margin-left:auto;color:inherit;text-decoration:none;font-size:13px}.toolbar{padding:16px 30px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}.group{display:flex;gap:4px;padding:4px;background:#e4e6eb;border-radius:8px}.group button{border:0;padding:9px 14px;border-radius:5px;background:transparent;color:#525761}.group button[aria-pressed="true"]{background:white;color:#16181c;box-shadow:0 1px 4px #0001;font-weight:600}main{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:24px;padding:0 30px}.preview{min-width:0}.stage{position:relative;width:100%;background:#dfe2e7;min-height:400px;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;border:1px solid #d7dae0;border-radius:4px}.frame-wrap{position:relative;flex:none;overflow:hidden;background:white;box-shadow:0 14px 38px #24262b17}iframe{border:0;display:block;transform-origin:top left;background:#fff;position:absolute;left:0;top:0}.stage.phone{padding:16px 0;background:#e3e5e9}.phone .frame-wrap{border-radius:16px;box-shadow:0 12px 40px #0002}.caption{display:flex;justify-content:space-between;padding:10px 0;color:#767b85;font-size:12px}.caption a{color:#343841}.notes{padding:3px 2px}.notes .tag{font-size:11px;color:#757b85;letter-spacing:1.4px}.notes h1{font-size:27px;line-height:1.4;letter-spacing:-1px;margin:10px 0}.notes .thesis{font-size:15px;color:#4a505a;line-height:1.9;margin-bottom:24px}.palette{display:flex;gap:5px;margin:16px 0 26px}.palette i{width:35px;height:20px;border:1px solid #0001;border-radius:3px}.notes h2{font-size:13px;margin:20px 0 8px}.notes p{font-size:12px;color:#656b76;line-height:1.85;margin:0}.notes ul{padding-left:17px;color:#656b76;font-size:12px;line-height:1.9}.note-block{border-top:1px solid #d5d8de;padding-top:12px;margin-top:20px}.notes a{color:#474e5a}.smallprint{margin:20px 30px 0;padding:16px 0;border-top:1px solid #d9dde3;font-size:12px;line-height:1.9;color:#727883;display:flex;gap:30px;justify-content:space-between}.smallprint a{color:#4b535f}.hint{font-size:12px;color:#7a808a;margin-left:auto}button:focus-visible,a:focus-visible{outline:2px solid #3565c9;outline-offset:3px}@media(max-width:900px){header{padding:15px 18px;flex-wrap:wrap}header span{font-size:12px}header a{font-size:12px}.toolbar{padding:12px 18px;gap:10px}.group button{padding:8px 10px;font-size:12px}main{padding:0 18px;grid-template-columns:1fr}.notes{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.notes .intro{grid-column:1/-1}.notes .thesis{margin-bottom:0}.palette{margin:10px 0}.notes h1{font-size:24px}.notes h2{margin-top:8px}.note-block{grid-column:1/-1}.smallprint{margin:20px 18px;display:block}.hint{display:none}}
</style>
<header><strong>Lowpass</strong><span>三主题整页预览 · 默认 A</span><span class="decision">A / B / C 已确认全部保留</span></header>
<div class="toolbar"><div class="group" id="worlds" aria-label="主题"><button data-value="daybreak" aria-pressed="true">A 层叠清晨 · 默认</button><button data-value="duet" aria-pressed="false">B 双声部</button><button data-value="unfold" aria-pressed="false">C 展开阅读</button></div><div class="group" id="scenes" aria-label="页面"><button data-value="daily" aria-pressed="true">日刊</button><button data-value="library" aria-pressed="false">收藏与搜索</button><button data-value="admin" aria-pressed="false">后台</button></div><div class="group" id="devices" aria-label="尺寸"><button data-value="desktop" aria-pressed="true">桌面</button><button data-value="phone" aria-pressed="false">手机</button><button data-value="tablet" aria-pressed="false">平板 / 分屏</button><button data-value="wide" aria-pressed="false">宽屏</button></div><span class="hint">切换主题 · 记住当前浏览器的预览选择</span></div>
<main><section class="preview"><div class="stage" id="stage"><div class="frame-wrap" id="wrap"><iframe id="frame" title="Lowpass 设计草图" src="../decision/daybreak.html"></iframe></div></div><div class="caption"><span id="size-label">1440 px · 整页预览</span><a id="open" href="../decision/daybreak.html" target="_blank">原尺寸打开 ↗</a></div></section><aside class="notes" id="notes"></aside></main>
<footer class="smallprint"><div>内容与状态为设计演示；刊期组合不代表当天榜单。中文概述与理由依实际资料编写，尚未接入内容生成。<br>已应用三套真实中英文字体，可滚动查看整页。当前仅为主题预览；记住的主题仅用于此预览，保存、搜索、编辑没有连接生产应用。本地搜索、收藏撤销、主题切换与抓取记录可试用；其余动效说明仍为提案。</div><div>内容依据：<a href="https://rikiyat.github.io/blog/weight-space-programming/" target="_blank" rel="noreferrer">Weight-Space Programming</a><br><a href="https://github.com/astral-sh/uv#scripts" target="_blank" rel="noreferrer">uv README · Scripts</a></div></footer>
<script>
const designs={daybreak:{name:'层叠清晨',fonts:'寒蝉圆黑体 × Bricolage Grotesque',tag:'A / CHAPTERS IN COLOUR',thesis:'用鲜明色面把一期组织成连续章节，让晨读有打开一本新刊的愉悦。',palette:['#075B63','#203F31','#C99D47','#FCFAF2'],structure:'青蓝刊头建立期身份，来源横带交代位置。中文解释与具体价值紧邻，进入正文后缩短导航占比。',motion:'跨来源时，章节带连同标题进入；收藏在原位确认。过渡以 180–260ms 的位移与颜色变化为主，正文不等待动画。',reach:'周刊沿用章节入口与宽正文；归档按日期展开。收藏保留用途，搜索按命中内容定位；后台把色面缩到导航与状态。',risk:'刊头很有存在感，后续须控制连续阅读时占屏比例；不能退回纸纹、复古徽章或卡片堆叠。'},duet:{name:'双声部',fonts:'寒蝉锦书宋 × Newsreader',tag:'B / UNDERSTAND & DISCOVER',thesis:'把「讲了什么」与「有什么值得关注」并排编排，让中文理解与正文价值形成清楚的对应。',palette:['#FDFDFB','#151515','#E8E8E5'],structure:'用黑白块、序号与逐条对齐取代卡片。桌面双列对读；手机按条目收为先内容、后价值的连续段落。',motion:'原文展开沿同一条目基线延伸；收藏填实标记，取消提供恢复。来源定位平滑移动，键盘焦点清楚落在新位置。',reach:'收藏把名称、用途和出处对位；搜索沿同一网格展示命中。周刊改为正文加页边目录；后台用字重、图形、标签明确状态。',risk:'主文与理由长短不同，需要真实长内容验证对齐；黑白必须靠字级与结构成立，不能只剩细线。'},unfold:{name:'展开阅读',fonts:'未来荧黑 × IBM Plex Sans',tag:'C / FOLLOW THE THREAD',thesis:'用深色阅读平面与可展开的原文线索，让当下阅读和日后利用连在一起。',palette:['#121415','#24292C','#E8E7E1','#CEB573'],structure:'中文正文常驻，来源作为短折栏；原文信息沿清楚锚点展开。金色只标可继续追溯与已保存，不用装饰光效。',motion:'展开段落从已有锚点自然增长，收藏状态原位收拢，回到刊期恢复位置。手机用点击展开，不要求拖拽或手势学习。',reach:'收藏与搜索保持暗色资料列表，名字、用途、原文入口直接可见。周刊长正文保留图片本色；后台用更紧凑网格和明确失败文本。',risk:'长时间深色阅读的舒适度要验证；金色只做少量锚点，避免成为奢侈品或发光仪表盘。'}};
const previewThemeKey='lowpass-design-preview-theme-v2';let savedTheme='daybreak';try{const saved=localStorage.getItem(previewThemeKey);if(Object.hasOwn(designs,saved))savedTheme=saved;}catch{}const params=new URLSearchParams(location.search);let state={world:Object.hasOwn(designs,params.get('world'))?params.get('world'):savedTheme,scene:['library','admin'].includes(params.get('scene'))?params.get('scene'):'daily',device:['phone','tablet','wide'].includes(params.get('device'))?params.get('device'):'desktop'};const frame=document.querySelector('#frame'),wrap=document.querySelector('#wrap'),stage=document.querySelector('#stage');
function fit(reset=false){
  const phone=state.device==='phone',tablet=state.device==='tablet',wide=state.device==='wide',w=phone?390:tablet?768:wide?2320:1440,base=phone?844:tablet?1024:900;
  frame.style.width=w+'px';
  if(reset || !frame.style.height)frame.style.height=base+'px';
  const h=parseFloat(frame.style.height),available=stage.clientWidth-(phone?32:0),scale=Math.min(available/w,1);
  frame.style.transform=`scale(${scale})`;wrap.style.width=w*scale+'px';wrap.style.height=h*scale+'px';
  stage.style.height=(h*scale+(phone?32:0))+'px';stage.style.minHeight='0';
  document.querySelector('#size-label').textContent=`${w} × ${Math.ceil(h)} · 整页预览`;
}
let contentObserver;
function measure(reset=false){
  const doc=frame.contentDocument;if(!doc?.body)return;
  if(reset)frame.style.height=(state.device==='phone'?844:state.device==='tablet'?1024:900)+'px';
  const h=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight);
  if(parseFloat(frame.style.height)!==h)frame.style.height=h+'px';
  fit();
}
frame.addEventListener('load',async()=>{
  contentObserver?.disconnect();
  const doc=frame.contentDocument;await doc.fonts.ready;
  measure(true);
  contentObserver=new ResizeObserver(()=>measure());contentObserver.observe(doc.body);
  doc.addEventListener('toggle',()=>measure(true),true);
});
function render(){const d=designs[state.world],suffix=state.scene==='daily'?'':'-'+state.scene,url='../decision/'+state.world+suffix+'.html';frame.src=url;document.querySelector('#open').href=url;stage.classList.toggle('phone',state.device==='phone');document.querySelector('#notes').innerHTML=`<div class="intro"><h1>${d.name}</h1><p class="font-pair">${d.fonts}</p><div class="thesis">${d.thesis}</div><div class="palette">${d.palette.map(x=>`<i style="background:${x}"></i>`).join('')}</div></div><div><h2>阅读怎么组织</h2><p>${d.structure}</p><h2>交互与动效提案</h2><p>${d.motion}</p></div><div><h2>如何延展到整站</h2><p>${d.reach}</p><h2>需要守住的边界</h2><p>${d.risk}</p></div><div class="note-block"><p>已确认：三套完整主题都保留，默认 A。内容、来源顺序和功能一致；生产版切换还需保持当前阅读与操作状态。</p></div>`;fit(true)}
for(const [id,key] of [['worlds','world'],['scenes','scene'],['devices','device']]){document.querySelectorAll('#'+id+' button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.value===state[key]?'true':'false'));}for(const [id,key] of [['worlds','world'],['scenes','scene'],['devices','device']])document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state[key]=b.dataset.value;if(key==='world'){try{localStorage.setItem(previewThemeKey,state.world);}catch{}}document.querySelectorAll('#'+id+' button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));render()});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='lowpass-preview-theme'||!Object.hasOwn(designs,e.data.theme))return;state.world=e.data.theme;state.scene=e.data.scene;for(const [id,key] of [['worlds','world'],['scenes','scene']])document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===state[key])));render()});new ResizeObserver(()=>fit()).observe(stage);render();
</script></html>
