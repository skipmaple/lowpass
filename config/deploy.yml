# Kamal 部署（ADR T4、T5、T12）：一台阿里云轻量（香港，x86_64）跑 web 单容器加 PostgreSQL accessory。
# 这台机器上的 kamal-proxy 已在为另一个应用服务，lowpass 作为第二个应用共用它，按域名分流；
# 变量的值全部来自 .kamal/secrets 读取的部署机环境，仓库里只有变量名。操作步骤见 docs/development.md「部署」。
<%# 服务器地址不进仓库：本机从 deploy.env、CI 从 Environment secret 读 DEPLOY_HOST（docs/development.md「部署」） %>
<% host = ENV["DEPLOY_HOST"].to_s.strip; abort "DEPLOY_HOST is not set: the server address is kept out of the repo, see docs/development.md" if host.empty? %>
service: lowpass

# 镜像在 Docker Hub：skipmaple/lowpass
image: skipmaple/lowpass

servers:
  web:
    - <%= host %>
  # ADR T4：起步单容器，Solid Queue 以 Puma 插件跑在 web 里（下面 env.clear 的 SOLID_QUEUE_IN_PUMA）。
  # 要拆 job 角色时打开这一段，并去掉 SOLID_QUEUE_IN_PUMA：
  # job:
  #   hosts:
  #     - <%= host %>
  #   cmd: bin/jobs

# kamal-proxy 做 SSL（Let's Encrypt，HTTP-01）。production.rb 的 force_ssl / assume_ssl 已经打开。
# 域名在 Cloudflare 上开着橙云代理时：SSL/TLS 加密模式设「完全」，首次签证书期间关掉「始终使用 HTTPS」，
# 不然 Let's Encrypt 的校验请求会被跳到 https 而源站还没有证书。
proxy:
  ssl: true
  host: lowpass.tech

registry:
  # Docker Hub 不用写 server；密码用访问令牌（Read & Write），不是账号密码
  username: skipmaple
  password:
    - KAMAL_REGISTRY_PASSWORD

# 两条构建路：本机是 Apple Silicon，直接在服务器上构建，省掉 QEMU 模拟的几倍耗时；
# CI（.github/workflows/deploy.yml）设了 KAMAL_BUILD_LOCAL，runner 本身就是 x86_64，就地构建，
# 层缓存放 GitHub Actions cache。这个文件经 ERB 求值，条件只看这一个环境变量。
builder:
  arch: amd64
<% if ENV["KAMAL_BUILD_LOCAL"].to_s.empty? %>
  remote: ssh://root@<%= host %>
<% else %>
  cache:
    type: gha
    options: mode=max
<% end %>

env:
  secret:
    - RAILS_MASTER_KEY
    # 数据库：accessory 的口令（值与 POSTGRES_PASSWORD 相同），见 .kamal/secrets
    - PGPASSWORD
    # 登录（P2-①）：OAuth 凭证与管理员白名单
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET
    - ADMIN_EMAILS
    # 告警（P2-③）：渠道与站点地址
    - BASE_URL
    - ALERT_EMAIL_TO
    - ALERT_EMAIL_FROM
    - ALERT_WEBHOOK_URL
    - ALERT_WEBHOOK_FORMAT
    - SMTP_ADDRESS
    - SMTP_PORT
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - SMTP_DOMAIN
    - SMTP_AUTHENTICATION
    - SMTP_STARTTLS
    # 推荐理由（P2-④）
    - MODEL_API_KEY
  clear:
    # Solid Queue 的 supervisor 跑在 Puma 进程里（config/puma.rb 的插件），调度 tick 与所有 job 都在这里
    SOLID_QUEUE_IN_PUMA: true

    # 数据库在同一台机器的 accessory 上：docker 网络 kamal 里的 lowpass-db；主库与队列库都用这组变量
    PGHOST: lowpass-db
    PGPORT: 5432
    PGUSER: lowpass

    # 需要时再开：Puma worker 数、日志级别
    # WEB_CONCURRENCY: 2
    # RAILS_LOG_LEVEL: debug

# 零停机切换时新旧容器共用一份前端资源，避免切换瞬间指纹资源 404（vite_rails 输出在 public/vite）
asset_path: /rails/public/vite

accessories:
  db:
    image: postgres:17
    host: <%= host %>
    # 不发布到宿主机端口：127.0.0.1:5432 已被这台机器上另一个应用的库占用；应用走 docker 网络访问。
    # 要在本机连库用 bin/kamal accessory exec db "psql -U lowpass lowpass_production" 或 dbc。
    env:
      clear:
        POSTGRES_USER: lowpass
        POSTGRES_DB: lowpass_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      # 数据在宿主机 /root/lowpass-db/data；备份任务是 P3 的事，先别指望它
      - data:/var/lib/postgresql/data
