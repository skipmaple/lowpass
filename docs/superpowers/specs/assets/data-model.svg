<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-label="概念数据模型：用户绑定多个登录身份；信息源产出多个条目并记录多次抓取任务；期包含多个条目；条目同时归属一个信息源和一期。虚线的用户源订阅是 P1。">
<style>
svg{color:#3E4956;font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
.box{fill:#FFFFFF;stroke:currentColor;stroke-width:1.2}
.box.hi{stroke:#1F5F8B;stroke-width:1.6}
.box.dash{stroke-dasharray:4 3}
.ln{stroke:currentColor;fill:none;stroke-width:1.2}
.ln.dash{stroke-dasharray:4 3}
.sep{stroke:#B8C0CB;stroke-width:1}
text{fill:currentColor;font-size:12px}
.t{font-weight:600;font-size:13px;fill:#1B2430}
.s{font-size:11px;fill:#6B7684}
.f{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#6B7684}
.lb{font-size:11px;fill:#6B7684}
.ar{fill:currentColor}
</style>
<rect width="100%" height="100%" fill="#F5F6F8"/>

      <defs>
        <marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="ar" d="M0,0 L8,4 L0,8 z"/></marker>
      </defs>
      <!-- User -->
      <rect class="box" x="40" y="20" width="190" height="92"/>
      <text class="t" x="52" y="37">用户 User</text>
      <line class="sep" x1="40" y1="46" x2="230" y2="46"/>
      <text class="f" x="52" y="62">display_name</text>
      <text class="f" x="52" y="77">email</text>
      <text class="f" x="52" y="92">avatar_url</text>
      <text class="f" x="52" y="107">role: admin | member</text>
      <!-- Pref (P1) -->
      <rect class="box dash" x="262" y="30" width="110" height="78"/>
      <text class="t" x="274" y="47">源订阅（P1）</text>
      <line class="sep" x1="262" y1="56" x2="372" y2="56"/>
      <text class="f" x="274" y="72">user_id</text>
      <text class="f" x="274" y="87">source_id</text>
      <text class="f" x="274" y="102">enabled</text>
      <line class="ln dash" x1="230" y1="66" x2="262" y2="66" marker-end="url(#ar2)"/>
      <text class="lb" x="246" y="58" text-anchor="middle">勾选</text>
      <line class="ln dash" x1="372" y1="66" x2="400" y2="66" marker-end="url(#ar2)"/>
      <!-- Source -->
      <rect class="box" x="400" y="20" width="190" height="122"/>
      <text class="t" x="412" y="37">信息源 Source</text>
      <line class="sep" x1="400" y1="46" x2="590" y2="46"/>
      <text class="f" x="412" y="62">name</text>
      <text class="f" x="412" y="77">adapter</text>
      <text class="f" x="412" y="92">publication: daily|weekly</text>
      <text class="f" x="412" y="107">config_json</text>
      <text class="f" x="412" y="122">schedule</text>
      <text class="f" x="412" y="137">enabled</text>
      <!-- FetchRun -->
      <rect class="box" x="730" y="20" width="190" height="92"/>
      <text class="t" x="742" y="37">抓取任务 FetchRun</text>
      <line class="sep" x1="730" y1="46" x2="920" y2="46"/>
      <text class="f" x="742" y="62">started_at</text>
      <text class="f" x="742" y="77">status</text>
      <text class="f" x="742" y="92">item_count</text>
      <text class="f" x="742" y="107">error</text>
      <line class="ln" x1="590" y1="66" x2="730" y2="66" marker-end="url(#ar2)"/>
      <text class="lb" x="660" y="58" text-anchor="middle">每次抓取 1..n</text>
      <!-- AuthIdentity -->
      <rect class="box" x="40" y="220" width="190" height="78"/>
      <text class="t" x="52" y="237">登录身份 AuthIdentity</text>
      <line class="sep" x1="40" y1="246" x2="230" y2="246"/>
      <text class="f" x="52" y="262">provider: google | github</text>
      <text class="f" x="52" y="277">provider_uid</text>
      <text class="f" x="52" y="292">email_verified</text>
      <line class="ln" x1="135" y1="112" x2="135" y2="220" marker-end="url(#ar2)"/>
      <text class="lb" x="143" y="170">绑定 1..n</text>
      <!-- Item -->
      <rect class="box" x="400" y="200" width="190" height="136"/>
      <text class="t" x="412" y="217">条目 Item</text>
      <line class="sep" x1="400" y1="226" x2="590" y2="226"/>
      <text class="f" x="412" y="242">title</text>
      <text class="f" x="412" y="257">url</text>
      <text class="f" x="412" y="272">url_hash</text>
      <text class="f" x="412" y="287">summary</text>
      <text class="f" x="412" y="302">section</text>
      <text class="f" x="412" y="317">meta_json</text>
      <text class="f" x="412" y="332">published_at</text>
      <line class="ln" x1="495" y1="142" x2="495" y2="200" marker-end="url(#ar2)"/>
      <text class="lb" x="503" y="175">产出 1..n</text>
      <!-- Issue -->
      <rect class="box hi" x="730" y="220" width="190" height="92"/>
      <text class="t" x="742" y="237">期 Issue</text>
      <line class="sep" x1="730" y1="246" x2="920" y2="246"/>
      <text class="f" x="742" y="262">type: daily | weekly</text>
      <text class="f" x="742" y="277">period_key</text>
      <text class="f" x="742" y="292">status</text>
      <text class="f" x="742" y="307">published_at</text>
      <line class="ln" x1="730" y1="266" x2="590" y2="266" marker-end="url(#ar2)"/>
      <text class="lb" x="660" y="258" text-anchor="middle">包含 1..n</text>
    </svg>
