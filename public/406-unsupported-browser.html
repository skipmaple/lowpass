<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>浏览器版本过旧 · Lowpass</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; background: #E8E3DA; color: #1D1D1B; font-family: "LXGW WenKai Screen", "Kaiti SC", KaiTi, serif; }
    main { max-width: 780px; margin: 8vh auto; border-top: 2px solid #1D1D1B; overflow-wrap: anywhere; }
    .brand { display: block; margin: 24px 0 32px; font-family: "Bodoni Moda", Didot, serif; font-size: 40px; font-weight: 900; }
    h1 { font-size: 26px; font-weight: 400; line-height: 1.5; margin: 0 0 16px; }
    p { max-width: 40em; margin: 0 0 24px; font-size: 15px; line-height: 1.7; color: #55504B; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; border-top: 1px solid #1D1D1B; padding-top: 24px; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 16px; border: 1px solid #1D1D1B; color: inherit; font-size: 15px; line-height: 1.5; text-decoration: none; }
    a:focus-visible { outline: 2px solid #1D1D1B; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="brand" aria-label="Lowpass">LOWPASS</span>
    <h1>浏览器版本过旧</h1>
    <p>请升级浏览器，或使用最新版 Chrome、Edge、Firefox 或 Safari 后重新访问。</p>
    <nav aria-label="恢复操作">
      <a href="/">回到首页</a>
    </nav>
  </main>
</body>
</html>
