<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>服务暂时出错 · Lowpass</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; background: #E8E3DA; color: #1D1D1B; font-family: "LXGW WenKai Screen", "Kaiti SC", KaiTi, serif; }
    main { max-width: 780px; margin: 8vh auto; padding: 32px 0; background: #E8E3DA; border-top: 2px solid #1D1D1B; }
    h1 { font-size: 26px; font-weight: 400; line-height: 1.5; margin: 0 0 24px; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; border-top: 1px solid #1D1D1B; padding-top: 24px; }
    a, button { min-height: 44px; padding: 10px 16px; border: 1px solid #1D1D1B; border-radius: 0; background: transparent; color: inherit; font: inherit; font-size: 15px; line-height: 1.5; text-decoration: none; cursor: pointer; }
    a:focus-visible, button:focus-visible { outline: 2px solid #1D1D1B; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>服务暂时出错，页面无法加载。</h1>
    <nav aria-label="恢复操作">
      <a href="/">回到首页</a>
      <button type="button" onclick="window.location.reload()">重新加载</button>
    </nav>
  </main>
</body>
</html>
